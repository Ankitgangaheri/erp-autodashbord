{% extends "base.html" %}
{% block title %}Add User{% endblock %}
{% block page_title %}Add New User{% endblock %}
{% block topbar_actions %}<a href="{{ url_for('auth.users') }}" class="btn btn-secondary btn-sm">← Back</a>{% endblock %}
{% block content %}
<div class="card" style="max-width:560px">
  <div class="card-header"><div class="card-title">🔐 New User</div></div>
  <form method="POST" data-validate>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Username <span class="required">*</span></label>
        <input type="text" name="username" class="form-control" required placeholder="Login username">
      </div>
      <div class="form-group">
        <label class="form-label">Role <span class="required">*</span></label>
        <select name="role" class="form-control" required>
          <option value="staff">Staff</option>
          <option value="manager">Manager</option>
          <option value="admin">Admin</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Full Name <span class="required">*</span></label>
      <input type="text" name="full_name" class="form-control" required placeholder="Display name">
    </div>
    <div class="form-group">
      <label class="form-label">Email <span class="required">*</span></label>
      <input type="email" name="email" class="form-control" required placeholder="user@autoerp.com">
    </div>
    <div class="form-group">
      <label class="form-label">Password <span class="required">*</span></label>
      <input type="password" name="password" class="form-control" required minlength="6" placeholder="Min 6 characters">
    </div>
    <hr class="divider">
    <div style="display:flex;gap:10px">
      <button type="submit" class="btn btn-primary">✓ Create User</button>
      <a href="{{ url_for('auth.users') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
