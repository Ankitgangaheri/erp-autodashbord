{% extends "base.html" %}
{% block title %}Add Customer{% endblock %}
{% block page_title %}Add Customer{% endblock %}
{% block topbar_actions %}
  <a href="{{ url_for('sales.customers') }}" class="btn btn-secondary btn-sm">← Back</a>
{% endblock %}
{% block content %}
<div class="card" style="max-width:640px">
  <div class="card-header"><div class="card-title">👤 New Customer</div></div>
  <form method="POST" data-validate>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Full Name <span class="required">*</span></label>
        <input type="text" name="name" class="form-control" required placeholder="Customer full name">
      </div>
      <div class="form-group">
        <label class="form-label">Phone</label>
        <input type="text" name="phone" class="form-control" placeholder="+91 98765 43210">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" placeholder="customer@email.com">
      </div>
      <div class="form-group">
        <label class="form-label">GST Number</label>
        <input type="text" name="gst_number" class="form-control" placeholder="GST/Tax ID">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">City</label>
        <input type="text" name="city" class="form-control" placeholder="City">
      </div>
      <div class="form-group">
        <label class="form-label">Address</label>
        <input type="text" name="address" class="form-control" placeholder="Street address">
      </div>
    </div>
    <hr class="divider">
    <div style="display:flex;gap:10px">
      <button type="submit" class="btn btn-primary">✓ Add Customer</button>
      <a href="{{ url_for('sales.customers') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
