{% extends "base.html" %}
{% block title %}Add Supplier{% endblock %}
{% block page_title %}Add New Supplier{% endblock %}
{% block topbar_actions %}<a href="{{ url_for('suppliers.index') }}" class="btn btn-secondary btn-sm">← Back</a>{% endblock %}
{% block content %}
<div class="card" style="max-width:760px">
  <div class="card-header"><div class="card-title">🏭 New Supplier</div></div>
  <form method="POST" data-validate>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Company Name <span class="required">*</span></label>
        <input type="text" name="name" class="form-control" required placeholder="Supplier name">
      </div>
      <div class="form-group">
        <label class="form-label">Contact Person</label>
        <input type="text" name="contact_person" class="form-control" placeholder="Primary contact">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" placeholder="contact@supplier.com">
      </div>
      <div class="form-group">
        <label class="form-label">Phone</label>
        <input type="text" name="phone" class="form-control" placeholder="+91 98765 43210">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Address</label>
      <textarea name="address" class="form-control" rows="2" placeholder="Street address"></textarea>
    </div>
    <div class="form-row-3">
      <div class="form-group">
        <label class="form-label">City</label>
        <input type="text" name="city" class="form-control" placeholder="City">
      </div>
      <div class="form-group">
        <label class="form-label">Country</label>
        <input type="text" name="country" class="form-control" value="India">
      </div>
      <div class="form-group">
        <label class="form-label">GST Number</label>
        <input type="text" name="gst_number" class="form-control" placeholder="GST/Tax ID">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Payment Terms</label>
      <select name="payment_terms" class="form-control">
        <option value="">Select…</option>
        {% for t in ['Net 15','Net 30','Net 45','Net 60','Advance Payment','Cash on Delivery'] %}
          <option>{{ t }}</option>
        {% endfor %}
      </select>
    </div>
    <hr class="divider">
    <div style="display:flex;gap:10px">
      <button type="submit" class="btn btn-primary">✓ Save Supplier</button>
      <a href="{{ url_for('suppliers.index') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
