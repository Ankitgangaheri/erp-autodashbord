{% extends "base.html" %}
{% block title %}Edit Supplier{% endblock %}
{% block page_title %}Edit Supplier{% endblock %}
{% block topbar_actions %}<a href="{{ url_for('suppliers.view_supplier', sid=supplier.id) }}" class="btn btn-secondary btn-sm">← Back</a>{% endblock %}
{% block content %}
<div class="card" style="max-width:760px">
  <div class="card-header"><div class="card-title">✏️ Edit — {{ supplier.name }}</div></div>
  <form method="POST" data-validate>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Company Name <span class="required">*</span></label>
        <input type="text" name="name" class="form-control" value="{{ supplier.name }}" required>
      </div>
      <div class="form-group">
        <label class="form-label">Contact Person</label>
        <input type="text" name="contact_person" class="form-control" value="{{ supplier.contact_person or '' }}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" value="{{ supplier.email or '' }}">
      </div>
      <div class="form-group">
        <label class="form-label">Phone</label>
        <input type="text" name="phone" class="form-control" value="{{ supplier.phone or '' }}">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Address</label>
      <textarea name="address" class="form-control" rows="2">{{ supplier.address or '' }}</textarea>
    </div>
    <div class="form-row-3">
      <div class="form-group">
        <label class="form-label">City</label>
        <input type="text" name="city" class="form-control" value="{{ supplier.city or '' }}">
      </div>
      <div class="form-group">
        <label class="form-label">Country</label>
        <input type="text" name="country" class="form-control" value="{{ supplier.country or 'India' }}">
      </div>
      <div class="form-group">
        <label class="form-label">GST Number</label>
        <input type="text" name="gst_number" class="form-control" value="{{ supplier.gst_number or '' }}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Payment Terms</label>
        <select name="payment_terms" class="form-control">
          <option value="">Select…</option>
          {% for t in ['Net 15','Net 30','Net 45','Net 60','Advance Payment','Cash on Delivery'] %}
            <option {% if supplier.payment_terms == t %}selected{% endif %}>{{ t }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group" style="display:flex;align-items:flex-end;padding-bottom:4px">
        <label class="form-check">
          <input type="checkbox" name="is_active" {% if supplier.is_active %}checked{% endif %}> Supplier is Active
        </label>
      </div>
    </div>
    <hr class="divider">
    <div style="display:flex;gap:10px">
      <button type="submit" class="btn btn-primary">✓ Save Changes</button>
      <a href="{{ url_for('suppliers.view_supplier', sid=supplier.id) }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
